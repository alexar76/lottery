# Snippet for lottery.modelmarket.dev — proxy relayer API in front of the showcase.
# Insert these locations BEFORE `location /` so they are not swallowed by the SPA.
# Relayer listens on 127.0.0.1:8390 on admin-vps (compose override).

location = /economy {
    proxy_pass http://127.0.0.1:8390/economy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
location = /healthz {
    proxy_pass http://127.0.0.1:8390/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
location = /work-seat {
    proxy_pass http://127.0.0.1:8390/work-seat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 20s;
}
# X-Forwarded-For, not just X-Real-IP: the relayer's per-caller voucher bucket reads the
# forwarded chain (LOTTERY_TRUSTED_PROXIES must name this proxy). Without it every caller
# looked like 127.0.0.1 and shared one 60/hour bucket.
location = /voucher {
    proxy_pass http://127.0.0.1:8390/voucher;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 20s;
}
location ~ ^/rounds/ {
    proxy_pass http://127.0.0.1:8390;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
